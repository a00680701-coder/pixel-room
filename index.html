<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pixel Room</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-root"></div>

    <div id="toast" hidden></div>

    <div id="diary-modal" class="diary-modal" hidden inert>
      <div class="diary-backdrop" data-diary="backdrop"></div>
      <section class="diary-paper" role="dialog" aria-modal="true" aria-labelledby="diary-label">
        <button type="button" class="diary-x" data-diary="close" aria-label="關閉">×</button>
        <h2 id="diary-label">日記</h2>

        <div id="diary-list-view">
          <button type="button" class="diary-btn diary-btn-save diary-new" data-diary="new">
            寫新的一頁
          </button>
          <p id="diary-empty" class="diary-empty">還沒有寫過日記。先開一頁空白吧。</p>
          <div id="diary-list" class="diary-list"></div>
        </div>

        <div id="diary-edit-view" hidden>
          <p class="diary-date" id="diary-date"></p>

          <label class="diary-field">
            <span class="diary-kicker">標題</span>
            <input id="diary-heading" maxlength="40" placeholder="今天想記下什麼…" autocomplete="off" />
          </label>

          <label class="diary-field diary-field-body">
            <span class="diary-kicker">內文</span>
            <textarea id="diary-body" rows="7" placeholder="把這一頁慢慢寫完。"></textarea>
          </label>

          <div class="diary-actions">
            <button type="button" class="diary-btn diary-btn-save" id="diary-save" data-diary="save">儲存</button>
            <button type="button" class="diary-btn" data-diary="back">返回清單</button>
          </div>
        </div>
      </section>
    </div>

    <div id="touch-ui" hidden>
      <div class="dpad" id="dpad" aria-label="方向鍵">
        <span class="cell empty"></span>
        <button type="button" class="cell dir" data-dir="up" aria-label="上"></button>
        <span class="cell empty"></span>
        <button type="button" class="cell dir" data-dir="left" aria-label="左"></button>
        <span class="cell nub"></span>
        <button type="button" class="cell dir" data-dir="right" aria-label="右"></button>
        <span class="cell empty"></span>
        <button type="button" class="cell dir" data-dir="down" aria-label="下"></button>
        <span class="cell empty"></span>
      </div>

      <button type="button" class="btn-a" id="btn-a" aria-label="互動">
        <span class="btn-a-face">A</span>
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
