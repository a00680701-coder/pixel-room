<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pixel Room</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-root"></div>

    <div id="toast" hidden></div>

    <div id="diary-modal" class="diary-modal" hidden inert>
      <div class="diary-backdrop" data-diary="backdrop"></div>
      <section class="diary-stage" role="dialog" aria-modal="true" aria-labelledby="diary-label">
        <h2 id="diary-label" class="diary-sr">日記</h2>
        <button type="button" class="diary-x" data-diary="close" aria-label="關閉">×</button>

        <div class="diary-book-wrap">
          <button type="button" class="diary-bookmark" data-diary="toc" aria-label="目錄" title="目錄"></button>
          <button type="button" class="diary-nav" data-diary="prev" id="diary-prev" aria-label="上一頁">‹</button>
          <button type="button" class="diary-nav" data-diary="next" id="diary-next" aria-label="下一頁">›</button>

          <div class="diary-book" id="diary-book">
            <div class="diary-page diary-page-left">
              <p class="diary-page-head" id="diary-left-head"></p>
              <textarea id="diary-left" class="diary-lines" rows="12" spellcheck="false" autocomplete="off"></textarea>
              <div id="diary-toc-left" class="diary-toc-pane" hidden></div>
              <p class="diary-page-num" id="diary-left-num"></p>
            </div>
            <div class="diary-spine" aria-hidden="true"></div>
            <div class="diary-page diary-page-right">
              <p class="diary-page-head" id="diary-right-head"></p>
              <textarea id="diary-right" class="diary-lines" rows="12" spellcheck="false" autocomplete="off"></textarea>
              <div id="diary-toc-right" class="diary-toc-pane" hidden></div>
              <p class="diary-page-num" id="diary-right-num"></p>
            </div>
          </div>
        </div>

        <p id="diary-status" class="diary-status" hidden></p>
      </section>
    </div>

    <div id="touch-ui" hidden>
      <div class="dpad" id="dpad" aria-label="方向鍵">
        <span class="cell empty"></span>
        <button type="button" class="cell dir" data-dir="up" aria-label="上"></button>
        <span class="cell empty"></span>
        <button type="button" class="cell dir" data-dir="left" aria-label="左"></button>
        <span class="cell nub"></span>
        <button type="button" class="cell dir" data-dir="right" aria-label="右"></button>
        <span class="cell empty"></span>
        <button type="button" class="cell dir" data-dir="down" aria-label="下"></button>
        <span class="cell empty"></span>
      </div>

      <button type="button" class="btn-a" id="btn-a" aria-label="互動">
        <span class="btn-a-face">A</span>
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
